<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="global.css">
<style>body { margin: 0; padding: 0; }</style>
</head>
<body>
<div class="slide" style="background: var(--brand-cream);">

<div style="padding: 48px 60px; height: 100%; display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <div class="tag sticker sticker-yellow" style="transform: rotate(-1deg);">Pro Dashboard</div>
    <div class="sticker sticker-ink" style="font-size: 28px; font-weight: 800; transform: rotate(1deg);">₹299 / month</div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; flex: 1; align-content: center;">
    
    <div class="sticker" style="background: var(--brand-cream); text-align: center; font-size: 16px; font-weight: 800; color: var(--brand-ink); transform: rotate(-1deg); display: flex; align-items: center; justify-content: center;">
      Nearby hot products
    </div>
    
    <div class="sticker" style="background: white; text-align: center; font-size: 16px; font-weight: 800; color: var(--brand-ink); transform: rotate(1deg); display: flex; align-items: center; justify-content: center;">
      Sales analytics
    </div>
    
    <div class="sticker" style="background: var(--brand-cream); text-align: center; font-size: 16px; font-weight: 800; color: var(--brand-ink); transform: rotate(-1deg); display: flex; align-items: center; justify-content: center;">
      Smart pricing
    </div>
    
    <div class="sticker" style="background: white; text-align: center; font-size: 16px; font-weight: 800; color: var(--brand-ink); transform: rotate(1deg); display: flex; align-items: center; justify-content: center;">
      Slow-mover alerts
    </div>
    
    <div class="sticker" style="background: var(--brand-cream); text-align: center; font-size: 16px; font-weight: 800; color: var(--brand-ink); transform: rotate(-1deg); display: flex; align-items: center; justify-content: center;">
      Festival readiness
    </div>
    
    <div class="sticker" style="background: white; text-align: center; font-size: 16px; font-weight: 800; color: var(--brand-ink); transform: rotate(1deg); display: flex; align-items: center; justify-content: center;">
      Demand heatmap
    </div>
    
  </div>
  <div class="sticker sticker-green" style="text-align: center; font-size: 20px; font-weight: 800; margin-top: 16px;">
    No commission. No ads. No race to the bottom.
  </div>
  <div style="text-align: center; font-size: 14px; color: var(--muted); margin-top: 8px; font-weight: 600;">
    The shopkeeper who succeeds pays the same ₹299 as the one just starting.
  </div>
</div>

<div class="footer-brand">Vyapaar-Mitra  ·  Kuch Karke Dikhana Hai</div>
<div class="page-num">11 / 14</div>
</div>
</body>
</html>
