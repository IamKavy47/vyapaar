<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="global.css">
<style>body { margin: 0; padding: 0; }</style>
</head>
<body>
<div class="slide" style="background: var(--brand-yellow);">

<div style="padding: 60px 80px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--brand-yellow);">
  <div style="font-family: var(--font-display); font-size: 56px; color: var(--brand-ink); margin-bottom: 24px;">Meet Vyapaar-Mitra</div>
  <div style="font-size: 36px; font-weight: 800; color: var(--brand-green); margin-bottom: 40px;">Go live without a catalog.</div>
  <div style="font-size: 18px; color: var(--brand-ink); opacity: 0.7; margin-bottom: 32px; font-weight: 600;">A shopkeeper joins with just TWO things:</div>
  <div style="display: flex; gap: 32px;">
    <div class="sticker" style="background: white; text-align: center; min-width: 200px; transform: rotate(-2deg);">
      <div style="font-family: var(--font-display); font-size: 28px; color: var(--brand-ink);">CATEGORY</div>
      <div style="font-size: 14px; color: var(--muted); margin-top: 8px;">Kirana · Hardware · Medical</div>
    </div>
    <div style="font-size: 40px; font-weight: 800; color: var(--brand-ink); align-self: center;">+</div>
    <div class="sticker" style="background: white; text-align: center; min-width: 200px; transform: rotate(2deg);">
      <div style="font-family: var(--font-display); font-size: 28px; color: var(--brand-ink);">LOCATION</div>
      <div style="font-size: 14px; color: var(--muted); margin-top: 8px;">Lat + Lng only</div>
    </div>
  </div>
  <div style="margin-top: 32px; font-size: 20px; font-weight: 800; color: var(--brand-ink);">That's it. No catalog. No barcode. No upload.</div>
</div>

<div class="footer-brand">Vyapaar-Mitra  ·  Kuch Karke Dikhana Hai</div>
<div class="page-num">5 / 14</div>
</div>
</body>
</html>
