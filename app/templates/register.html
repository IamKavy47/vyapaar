{% extends "base.html" %}
{% block title %}Register · {{ app_name }}{% endblock %}
{% block content %}
<h2>Create your account</h2>
<p class="sub">Takes about 30 seconds.</p>

<form method="post" action="/auth/register" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

  <label for="full_name">Full name</label>
  <input id="full_name" name="full_name" type="text" autocomplete="name" required />

  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required />

  <label for="phone">Phone number</label>
  <input id="phone" name="phone" type="tel" autocomplete="tel" required />

  <label for="password">Password</label>
  <input id="password" name="password" type="password" minlength="8"
         autocomplete="new-password" required />
  <p class="hint">At least 8 characters.</p>

  <label for="role">I am a</label>
  <select id="role" name="role">
    <option value="customer" {% if role_hint == 'customer' %}selected{% endif %}>Customer</option>
    <option value="shopkeeper" {% if role_hint == 'shopkeeper' %}selected{% endif %}>Shopkeeper</option>
  </select>

  {% include "_shop_fields.html" with context %}

  <button type="submit">Create account</button>
</form>

<p class="alt">Already registered? <a href="/auth/login">Log in</a></p>
{% endblock %}
