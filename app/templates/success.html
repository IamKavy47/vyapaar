{% extends "base.html" %}
{% block title %}Success · {{ app_name }}{% endblock %}
{% block content %}
<div class="status success">
  <div class="status-icon">✅</div>
  <h2>{{ title }}</h2>
  <p class="sub">{{ message }}</p>
  {% if full_name %}
  <dl class="summary">
    <dt>Name</dt><dd>{{ full_name }}</dd>
    <dt>Role</dt><dd>{{ role }}</dd>
  </dl>
  {% endif %}
</div>
{% endblock %}
